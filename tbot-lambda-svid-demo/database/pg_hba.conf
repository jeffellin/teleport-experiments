# TYPE   DATABASE  USER              ADDRESS        METHOD
# Local socket: how install-postgres.sh runs init.sql as the postgres user
local    all       all                              trust

# Admin access only from inside the host/container
host     all       postgres          127.0.0.1/32   scram-sha-256

# The Lambda: TLS required, client cert required, and the cert must chain to
# ssl_ca_file (the Teleport SPIFFE CA) with CN == DB role name. No password.
hostssl  demo      lambda_svid_demo  0.0.0.0/0      cert
hostssl  demo      lambda_svid_demo  ::/0           cert

# Everything else is rejected
host     all       all               0.0.0.0/0      reject
host     all       all               ::/0           reject
